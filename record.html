<!doctype html>
<html lang="en" data-loading>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://cykpvtekrdfmqimtrcps.supabase.co; connect-src 'self' https://cykpvtekrdfmqimtrcps.supabase.co; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Specification - DAME HUB</title>
<link rel="stylesheet" href="/dame-hub/core/v1/theme.css">
<link rel="stylesheet" href="/projects/assets/pr.css">
<link rel="stylesheet" href="/projects/assets/pr-legacy.css">
<link rel="icon" href="/dame-hub/core/v1/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/dame-hub/core/v1/icons/apple-touch-icon.png">
<script src="/dame-hub/core/v1/config.js" defer></script>
<script src="/dame-hub/core/v1/api.js" defer></script>
<script src="/dame-hub/core/v1/core.js" defer></script>
<script src="/projects/assets/pr-common.js" defer></script>
<script src="/projects/assets/pr-hub.js" defer></script>
<script src="/projects/assets/pr-options.js" defer></script>
<script src="/projects/assets/cm-highlight.js" defer></script>
<script src="/projects/assets/cm-focus.js" defer></script>
<script src="/projects/assets/xlsx-writer.js" defer></script>
<script src="/projects/assets/cm-rows.js" defer></script>
<script src="/projects/assets/cm-engine.js" defer></script>
<script src="/projects/assets/pr-xlsx.js" defer></script>
<script src="/projects/assets/pr-match.js" defer></script>
<script src="/projects/assets/pr-picks.js" defer></script>
<script src="/projects/assets/pr-record.js" defer></script>
</head>
<body class="pr-legacy">
<header id="topbar"></header>
<main class="page wide">
  <p class="small"><a id="back" href="/projects/">&larr; Projects</a></p>
  <div id="rc-loading"></div>
  <div class="empty" id="rc-error" role="alert" hidden></div>

  <div id="rc-main" hidden>
    <div class="page-head rc-page-head">
      <h1 id="rc-name"></h1>
      <div class="rc-facts" id="rc-facts"></div>
    </div>

    <!-- the work bar: stays under the top bar, slides away while reading down, comes back on the way up -->
    <div class="workbar" id="rc-workbar">
      <select class="input" id="rc-show" aria-label="Show">
        <option value="all">All rows</option>
        <option value="open">To fill</option>
        <option value="filled">Filled</option>
        <option value="review">Waiting for review</option>
      </select>
      <input class="input grow" id="rc-q" type="search" placeholder="Find a word in the specification" aria-label="Find" autocomplete="off">
      <span class="count" id="rc-count" role="status"></span>
      <div class="tabs mode-seg" id="rc-seg" role="group" aria-label="Read or edit"><button type="button" class="tab" data-mode="read" aria-selected="true">Read</button><button type="button" class="tab" data-mode="edit" aria-selected="false">Edit</button></div>
      <button type="button" class="btn dock-hide" id="rc-focus">Focus mode</button>
      <span class="more-items">
        <button type="button" class="btn ghost" id="rc-download" title="The file for the consultant: Sr, Specifications, Compliance, Remarks.">Download Excel</button>
        <button type="button" class="btn ghost" id="rc-download-work" title="Your working copy: colours, sources and the datasheet rows or the Selection list.">Download working Excel</button>
      </span>
      <button type="button" class="btn ghost more-btn" id="rc-more">More</button>
      <div class="rc-progress" aria-hidden="true"><i id="rc-bar"></i><i class="ai" id="rc-bar-ai" hidden></i></div>
    </div>

    <div class="rc-notes">
      <p class="rc-legend" id="rc-legend"><span class="lg-lib">Green: answer from the factory library</span><span class="lg-sheet">Blue chip: the datasheet value</span><span class="lg-opt">Dashed chip: what to select (approved Product Options)</span><span class="lg-own">Plain: answered in this project</span></p>
      <p class="hint" id="rc-mode"></p>
      <p class="hint" id="rc-sheet-note" hidden></p>
      <p class="hint" id="rc-review-note" hidden></p>
      <div class="notice warn" id="rc-factory-warn" role="alert" hidden></div>
    </div>
    <div class="empty" id="rc-empty" hidden></div>
    <div class="table-wrap sheet-wrap" id="rc-wrap">
      <table class="table sheet rc" id="rc-table">
        <thead><tr><th>Sr</th><th>Specifications</th><th>Compliance</th><th>Remarks</th><th>TL Review</th><th>Internal Comments</th><th></th></tr></thead>
        <tbody id="rc-body"></tbody>
      </table>
    </div>
    <datalist id="rc-words"><option value="Comply"><option value="Comply with Remarks"><option value="Noted"><option value="Not Comply"><option value="Not Applicable"><option value="In Contractor's Scope"></datalist>
  </div>
</main>

</body>
</html>
