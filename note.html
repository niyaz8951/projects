<!doctype html>
<html lang="en" data-loading>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://cykpvtekrdfmqimtrcps.supabase.co; connect-src 'self' https://cykpvtekrdfmqimtrcps.supabase.co; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F7FA">
<title>Datasheet notes - DAME HUB</title>
<link rel="stylesheet" href="/dame-hub/core/v1/theme.css">
<link rel="stylesheet" href="/projects/assets/pr.css">
<link rel="icon" href="/dame-hub/core/v1/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/dame-hub/core/v1/icons/apple-touch-icon.png">
<script src="/dame-hub/core/v1/config.js" defer></script>
<script src="/dame-hub/core/v1/api.js" defer></script>
<script src="/dame-hub/core/v1/core.js" defer></script>
<script src="/projects/assets/ds-xlsx.js" defer></script>
<script src="/projects/assets/pr-xlsx.js" defer></script>
<script src="/projects/assets/pr-common.js" defer></script>
<script src="/projects/assets/pr-picks.js" defer></script>
<script src="/projects/assets/pr-options.js" defer></script>
<script src="/projects/assets/pr-note.js" defer></script>
</head>
<body>
<header id="topbar"></header>
<main>
  <p><a class="btn small ghost" id="back" href="/projects/">&larr; Project</a></p>
  <div class="page-head">
    <div>
      <h1 id="name">Datasheet notes</h1>
      <p class="muted">The table read from the datasheet, as it was saved in the project.</p>
      <div class="chips" id="facts"></div>
    </div>
    <button type="button" class="btn primary" id="download" hidden>Download Excel</button>
  </div>

  <div id="loading"></div>

  <section class="card" id="body" hidden>
    <div class="pr-filters pr-two">
      <div class="field">
        <label for="q">Find</label>
        <input id="q" type="search" placeholder="Section, component or value" autocomplete="off" maxlength="120">
      </div>
      <label class="check" id="only-wrap" hidden><input type="checkbox" id="only"> Only rows that differ</label>
    </div>
    <p class="muted" id="diff" hidden></p>
    <div class="state" id="empty" hidden><p>No row matches.</p></div>
    <div class="table-wrap dn-preview" id="wrap" tabindex="0" role="region" aria-label="Datasheet table">
      <table id="table">
        <colgroup id="cols"></colgroup>
        <thead><tr id="head-row"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="hint">Rows and wording follow the row mapping at the time the datasheet was read. To change a value, read the datasheet again from the project.</p>
  </section>
</main>
</body>
</html>
